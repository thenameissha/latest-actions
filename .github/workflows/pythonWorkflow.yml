name: myPythonWorkflow
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
jobs:
  unit-test:
    name: Running unit test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'
      - name: install dependencies
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
      - name: run unit test
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=./ --cov-report=xml --cov-report=term-missing -v
     
      - name: upload code coverage report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: code-coverage-report
          path: reports/

  codeql:
    name: CodeQL analaysis
    runs-on: ubuntu-latest
    # we need to give extra permissions to security-events to upload code scanning alerts
    permissions:
      actions: read
      contents: read
      security-events: write #required to upload code scanning alerts
    strategy: #we can run codeql analysis for multiple languages in the same workflow using matrix strategy
      matrix:
        language: ['python']
    steps:
    - name: Checkout repository #dowload the repository code to the runner
      uses: actions/checkout@v5.0.0  
    - name: Initialize CodeQL #initialize the CodeQL tools and automatically create a database for the specified language
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
    - name: Perform CodeQL Analysis #analyze the code using CodeQL and upload the results as code scanning alerts if any vulnerabilities are found
      uses: github/codeql-action/analyze@v3
      with:
        category: "security"


  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          #test

      