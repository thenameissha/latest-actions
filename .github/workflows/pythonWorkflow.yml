name: myPythonWorkflow
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
jobs:
  unit-test:
    name: Running unit test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'
      - name: install dependencies
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
      - name: run unit test
        run: |
          mkdir reports/
          pytest -junitxml-reports/unit-test-results.xml --cov=./ --cov-report=xml --cov-report-term-missing -v
     
      - name: upload code coverage report
        uses: actions/upload-artifact@5.0.0
        with:
          name: code-coverage-report
          path: reports/